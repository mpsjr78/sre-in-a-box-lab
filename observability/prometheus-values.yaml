prometheus:
  prometheusSpec:
    retention: "1d"
    resources:
      requests:
        memory: "256Mi"
      limits:
        memory: "512Mi"
grafana:
  resources:
    requests:
      memory: "128Mi"
    limits:
      memory: "256Mi"
alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        memory: "64Mi"
      limits:
        memory: "128Mi"
